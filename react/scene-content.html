<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scene Content Animations - Scrollsequence React</title>
    <meta name="description" content="Scrollsequence React example demonstrating pinned scene content animations and synchronized overlay elements." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react';
      import ReactDOM from 'react-dom/client';
      import './src/index.css';
      import SceneContent from './src/examples/SceneContent';

      ReactDOM.createRoot(document.getElementById('root')).render(
        React.createElement(React.StrictMode, null, React.createElement(SceneContent))
      );
    </script>
  </body>
</html>
