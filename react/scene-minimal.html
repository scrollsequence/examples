<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinned Scene Minimal - Scrollsequence React</title>
    <meta name="description" content="Minimal Scrollsequence React example of a pinned scroll-driven canvas scene with overlay text." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react';
      import ReactDOM from 'react-dom/client';
      import './src/index.css';
      import SceneMinimal from './src/examples/SceneMinimal';

      ReactDOM.createRoot(document.getElementById('root')).render(
        React.createElement(React.StrictMode, null, React.createElement(SceneMinimal))
      );
    </script>
  </body>
</html>
