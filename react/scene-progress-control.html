<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinned Scene Progress Control - Scrollsequence React</title>
    <meta name="description" content="Scrollsequence React example demonstrating imperative progress control and interactive scrubbing via useRef." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react';
      import ReactDOM from 'react-dom/client';
      import './src/index.css';
      import SceneProgressControl from './src/examples/SceneProgressControl';

      ReactDOM.createRoot(document.getElementById('root')).render(
        React.createElement(React.StrictMode, null, React.createElement(SceneProgressControl))
      );
    </script>
  </body>
</html>
