<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scene with Static Content - Scrollsequence React</title>
    <meta name="description" content="Scrollsequence React example showing static document-flow HTML content scrolling over a pinned canvas scene using negative bottom margin." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react';
      import ReactDOM from 'react-dom/client';
      import './src/index.css';
      import SceneStaticContent from './src/examples/SceneStaticContent';

      ReactDOM.createRoot(document.getElementById('root')).render(
        React.createElement(React.StrictMode, null, React.createElement(SceneStaticContent))
      );
    </script>
  </body>
</html>
