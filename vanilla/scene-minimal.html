<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinned Scene Minimal - Scrollsequence Vanilla JS</title>
    <meta name="description" content="Minimal pinned canvas scene example with overlay text using Scrollsequence in vanilla JavaScript." />
    <link rel="stylesheet" href="scrollsequence/scrollsequence.css" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="min-h-screen bg-neutral-950 text-white">
    <!-- Spacer before sequence -->
    <section class="h-[50vh] flex items-center justify-center text-neutral-400">
      <p class="text-lg">Scroll down to start sequence ↓</p>
    </section>

    <!-- Pinned Scrollsequence Scene -->
    <div class="scrollsequence-scene">
      <div class="scrollsequence-scene_inner">
        <div class="scrollsequence-layer">
          <div
            class="scrollsequence-canvas2d"
            data-ssq-media-groups='[{"type":"manifest","rootDir":"https://cdn.scrollsequence.com/2026-09/dna-blue/","imageSizes":{"1920":{"width":1920,"height":1080,"files":{"i":"1920/%04d.jpg"},"frameCount":293}}}]'
          >
            <canvas></canvas>
          </div>
        </div>
        <div class="scrollsequence-layer">
          <div class="text-center px-4">
            <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight">
              Cinematic Scroll!
            </h1>
            <p class="mt-3 text-lg sm:text-xl text-neutral-300">
              60 FPS Hardware-Accelerated Scrubbing
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Spacer after sequence -->
    <section class="h-screen flex items-center justify-center text-neutral-400">
      <p className="text-lg">Sequence ended, continue reading...</p>
    </section>

    <script type="module">
      import ScrollsequenceManager from 'scrollsequence';
      import 'scrollsequence/scrollsequence.css';
      ScrollsequenceManager.initialize().preloadAll();
    </script>
  </body>
</html>
